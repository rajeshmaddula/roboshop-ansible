- name: catalogue configure
  hosts: catalogue
  become: yes
  tasks:

  - name: enable nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
     name: nodejs
     state: present

  - name: create system user roboshop 
    ansible.builtin.user:
    name: roboshop
    system: true
    home: /app
    shell: /sbin/nologin
    comment: "roboshop system user"
  
  - name: create app directory
    ansible.builtin.file:
     path: /app 
     state: directory
  
  - name: delete catalogue zip file
    ansible.builtin.file:
     path: /tmp/catalogue.zip
     state: absent
  
  - name: download catalogue
    ansible.builtin.get_url:
     url: /tmp/catalogue.zip https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
     dest: /tmp/catalogue.zip
  
  - name: Unarchive catalogue
    ansible.builtin.unarchive:
     src: /tmp/catalogue.zip
     dest: /app
     remote_src: yes

