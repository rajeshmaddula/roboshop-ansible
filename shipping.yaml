- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: install maven and mysql
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql

  - name: create system user roboshop
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  
  - name: delete app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: delete shipping zip file
    ansible.builtin.file:
      path: /tmp/shipping.zip
      state: absent

  - name: download shipping
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
      dest: /tmp/shipping.zip

  - name: unarchieve shipping
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: install dependencies 1
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app
  
  - name: install dependencies 2
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
    args: 
      chdir: /app

  - name: copy shipping service
    ansible.builtin.template:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service
  
  - name: daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Install Python pip
    ansible.builtin.dnf:
      name: python3-pip
      state: present

  - name: Install PyMySQL
    ansible.builtin.pip:
      name: PyMySQL
      executable: pip3

  - name: Import shipping data
    community.mysql.mysql_db:
      name: "{{ mysql_database }}"
      state: import
      target: "{{ item }}"
      login_host: "{{ MYSQL_HOST }}"
      login_user: root
      login_password: "{{ MYSQL_ROOT_PASSWORD }}"
    loop:
      - /app/db/schema.sql
      - /app/db/app-user.sql
      - /app/db/master-data.sql

  - name: start shipping
    ansible.builtin.service:
      name: shipping
      state: restarted
      enabled: yes