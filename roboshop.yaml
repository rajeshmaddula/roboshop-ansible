- name: create ec2 and r53 
  hosts: all
  connection: local
  vars:
   sg_id: sg-0eecd105120308fa3
   ami_id: ami-0055977a6e828a4f4
   env: dev
   instances:
   - mongodb
   - catalogue
  tasks:
  - name: create ec2 instance 
    amazon.aws.ec2_instance:
    name: "{{ item }}-{{ env }}"
    instance_type: "t3.micro"
    security_group: "{{ sg_id }}"
    image_id: "{{ ami_id }}"
    tags:
      Project: roboshop
      Environment: "{{ env }}"
      Name: "{{ item }}-{{ env }}"
  loop: "{{ instances }}"






  