- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0eecd105120308fa3
    ami_id: ami-0055977a6e828a4f4
    domain_name: raws88s.online
    env: dev
    action: create
    instances:
    - mongodb
    - catalogue
    - frontend
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == create

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    when: action == create

  - name: create route53 records
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "{{item.item}}-{{ env }}.{{ domain_name }}"
     type: A
     ttl: 1
     value: "{{ item.instances[0].private_ip_address }}"
     wait: true
    loop: "{{ec2_output.results}}"
    when: action == create

  - name: create route53 records for frontend
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "roboshop-{{ env }}.{{ domain_name }}" # instead of frontend-dev.raws88ss.online we will ause roboshop-dev.raws88s.online
     type: A
     ttl: 1
     value: "{{ item.instances[0].public_ip_address }}"
     wait: true
    loop: "{{ec2_output.results}}"
    when: 
    - item.item == "frontend"
    - action == create

- name: delete ec2instance
  ansible.builtin.ec2_instance:
   state: absent
   name: "{{ item}}-{{env}}""
  loop: {{ instances }}