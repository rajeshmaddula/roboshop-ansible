- name: create ec2 and r53 records
  connection: local
  hosts: all
  vars:
    ami_id: ami-0055977a6e828a4f4
    sg_id: sg-0574b9e33f7cce2ef
    zone_id: Z04101763H5LTU8MGM0UO
    env: dev
    instances:
      - mongodb
      - catalogue
  tasks:
    - name: create ec2 instance 
      amazon.aws.ec2_instance:
        image_id: "{{ ami_id }}"
        instance_type: "t3.micro"
        security_group: "{{ sg_id }}"
        name: "{{ item }}-{{ env }}"
        tags:
          Project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
          Name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"  
      register: ec2_output

    - name: print ec2_output
      ansible.builtin.debug:
       msg: "{{ ec2_output }}"
    
    - name: create r53 records
      amazon.aws.route53:
      
        



      
     
