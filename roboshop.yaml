- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-0eecd105120308fa3
    ami_id: ami-0055977a6e828a4f4
    domain_name: raws88s.online
    env: dev
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: creater53 records
    amazon.aws.route53:
     state: present
     zone: "{{ domain_name }}"
     record: "{{item.item}}-{{ env }}.{{ domain_name }}"
     type: A
     ttl: 1
     value: "{{ item.instance[0].private_ip_address }}"
     wait: true
    loop: "{{ec2_output}}"

  