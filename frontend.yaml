- name: configure frontend server
  hosts: frontend
  become: yes
  tasks: 
  - name: enable nginx:1.24
    ansible.builtin.command: nf module enable nginx:1.24 
  
  - name: install inginx
    ansible.builtin.dnf:
      name: nginx
      state: present
  
  - name: start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: present
      enabled: yes
  
  - name: Remove default web server content
    ansible.builtin.file:
      path: /usr/share/nginx/html/
      state: absent
  