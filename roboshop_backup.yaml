- name: create ec2 and r53 record
  hosts: all
  connection: local
  vars:
    sg_id: sg-0574b9e33f7cce2ef
    ami_id: ami-0055977a6e828a4f4
    env: dev
    instances:
      - mongodb
      - catalogue
  tasks:
  - name: create ec2 istance
    amazon.aws.ec2_instance:
     instance_type: "t3.micro"
     security_groups: "{{ sg_id}}"
     image_id: "{{ ami_id }}"
     name: "{{ item }}"
     tag:
      Poject: roboshop
      Component: "{{ item }}"
      Environement: "{{ env }}"
      name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_ouput

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_ouput }}"